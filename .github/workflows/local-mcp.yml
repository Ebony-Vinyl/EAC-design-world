name: Local MCP on Windows and macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Check subtitle renderer
        run: node -e "const {spawnSync}=require('node:child_process'); const r=spawnSync('ffmpeg',['-hide_banner','-filters'],{encoding:'utf8'}); if(r.status!==0 || !/\bass\s/.test(r.stdout)) throw new Error('FFmpeg must include the libass subtitle renderer');"
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Verify local MCP, browser capture, media queue and design export
        run: node --test --test-concurrency=1 tests/data-lock.test.mjs tests/lock-runtime.test.mjs tests/offline-update.test.mjs tests/release-source-hygiene.test.mjs tests/release-inputs.test.mjs tests/workspace-review.test.mjs tests/maintenance-updater.test.mjs tests/platform-paths.test.mjs tests/local-mcp.test.mjs tests/local-voice.test.mjs tests/audio-templates.test.mjs tests/engine.test.mjs tests/engine-review-regressions.test.mjs tests/mcp-transport.test.mjs tests/media-review-regressions.test.mjs tests/export-nle.test.mjs tests/export-review-regressions.test.mjs tests/export-ui.test.mjs tests/settings-secrets-ui.test.mjs tests/design-export.test.mjs tests/motion-recording.test.mjs tests/open-design-library.test.mjs tests/plugin-json.test.mjs tests/transcript.test.mjs tests/motion-libraries.test.mjs
